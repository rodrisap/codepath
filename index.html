<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1117" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>CodePath</title>
    <!--
      Makes the page "cross-origin isolated" on hosts where we can't set HTTP headers
      (GitHub Pages). That unlocks SharedArrayBuffer, which Python's input() and the
      "Stop" button need. On localhost the dev server sends the headers itself and
      this script does nothing.
    -->
    <script src="./vendor/coi-serviceworker.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
